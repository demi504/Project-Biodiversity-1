[pytest]
# Pytest configuration for UNIBEN Biodiversity Pipeline test suite

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options (when using pytest-cov)
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Asyncio mode for async tests
asyncio_mode = auto

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    frontend: marks tests as frontend tests
    backend: marks tests as backend tests
    api: marks tests as API tests
    database: marks tests requiring database access
    mock: marks tests using mocks
    requires_pandas: marks tests requiring pandas
    requires_torch: marks tests requiring pytorch
    requires_openpyxl: marks tests requiring openpyxl

# Ignore patterns
norecursedirs = .git .venv venv node_modules __pycache__ dist build

# Timeout for tests (optional, requires pytest-timeout)
# timeout = 300

# Minimum Python version
minversion = 7.0
